<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Savings ♡</title>
<style>
*{box-sizing:border-box}
:root{
  --navy:#09258f;--blue:#174fc8;--lav:#dfe3ff;--pink:#ff83b6;
  --ink:#123c9d;--white:#fdfdff
}
html,body{margin:0;min-height:100%;font-family:Arial,"Meiryo",sans-serif}
body{
  overflow-x:hidden;color:var(--ink);
  min-height:100vh;
  background:#101a79 url("pc-background.png") center center / cover fixed no-repeat;
}
@media (max-width: 700px){
  body{
    background-image: url("background-mobile.png");
    background-position: center top;
    background-size: cover;
    background-attachment: fixed;
  }
}  
body:before,body:after{
  content:"✦   ·   ✧      ·   ✦       ·   ✧";
  position:fixed;inset:0;pointer-events:none;z-index:0;
  color:#fff;font-size:18px;letter-spacing:22px;line-height:105px;
  opacity:.55;animation:stars 8s ease-in-out infinite
}
body:after{animation-duration:12s;animation-direction:reverse;opacity:.28;transform:scale(1.15)}
@keyframes stars{
  0%,100%{transform:translate3d(0,0,0)}
  50%{transform:translate3d(10px,14px,0)}
}

.sky{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.moon{
  position:absolute;right:5%;top:7%;width:112px;height:112px;border-radius:50%;
  background:#fff0a9;box-shadow:0 0 28px #fff0a966
}
.moon:after{
  content:"";position:absolute;right:25px;top:-4px;width:102px;height:102px;
  border-radius:50%;background:#071f91
}
.cloud{
  position:absolute;width:165px;height:34px;border-radius:40px;background:#a39de4aa;
  animation:cloud 18s ease-in-out infinite
}
.cloud:before,.cloud:after{content:"";position:absolute;background:#afa9edcc;border-radius:50%}
.cloud:before{width:65px;height:65px;left:20px;bottom:0}
.cloud:after{width:82px;height:82px;left:70px;bottom:-3px}
.c1{top:14%;left:5%}.c2{top:23%;right:9%;animation-delay:-6s;transform:scale(.75)}
.c3{top:34%;left:14%;animation-delay:-12s;transform:scale(.6)}
@keyframes cloud{50%{transform:translateX(24px)}}

.city{
  position:absolute;left:0;right:0;bottom:0;height:30%;
  background:linear-gradient(transparent,#182b82 18%)
}
.bld{position:absolute;bottom:0;width:7%;background:#192b7b;border-top:3px solid #3854b4}
.bld:after{
  content:"";position:absolute;inset:12px 7px;
  background:repeating-linear-gradient(90deg,#ffd877 0 5px,transparent 5px 15px);
  opacity:.65
}
.b1{left:2%;height:58%}.b2{left:11%;height:80%}.b3{left:20%;height:47%}
.b4{left:31%;height:72%}.b5{left:42%;height:53%}.b6{left:53%;height:82%}
.b7{left:64%;height:55%}.b8{left:74%;height:74%}.b9{left:86%;height:48%}
.star{
  position:absolute;color:#fff;font-size:20px;
  text-shadow:0 0 8px #fff,0 0 16px #ffb9ee;
  animation:twinkle 2.4s ease-in-out infinite, drift 7s ease-in-out infinite;
}
.s1{top:9%;left:18%}.s2{top:29%;left:78%;animation-delay:.7s}.s3{top:18%;left:60%;animation-delay:1.1s}
.s4{top:40%;left:8%;animation-delay:1.6s}.s5{top:13%;left:91%;animation-delay:.3s}
.s6{top:12%;left:34%;font-size:14px;animation-delay:.9s}.s7{top:25%;left:48%;font-size:14px;animation-delay:1.8s}
.s8{top:36%;left:88%;font-size:16px;animation-delay:2.2s}.s9{top:8%;left:72%;font-size:13px;animation-delay:1.4s}
.s10{top:46%;left:25%;font-size:13px;animation-delay:2.6s}.s11{top:20%;left:5%;font-size:15px;animation-delay:.5s}
.s12{top:31%;left:33%;font-size:13px;animation-delay:2.9s}.s13{top:16%;left:84%;font-size:15px;animation-delay:1.9s}
.s14{top:43%;left:69%;font-size:13px;animation-delay:3.2s}.s15{top:6%;left:52%;font-size:14px;animation-delay:1.2s}
@keyframes twinkle{0%,100%{opacity:.45;transform:scale(.8) rotate(0)}50%{opacity:1;transform:scale(1.35) rotate(18deg)}}
@keyframes drift{0%,100%{margin-left:0;margin-top:0}50%{margin-left:8px;margin-top:-6px}}

.app{
  position:relative;z-index:2;width:min(780px,calc(100% - 22px));
  margin:auto;padding:28px 0 70px
}
.top{display:flex;justify-content:space-between;align-items:center;padding:0 8px}
.logo{
  color:#fff;font-size:39px;font-weight:900;letter-spacing:1px;
  font-family:"Courier New",monospace;text-shadow:3px 3px #17378f
}
.sub{color:#fff;font-size:12px;font-weight:900;text-shadow:2px 2px #17378f}
.iconbtn{
  width:58px;height:58px;border:3px solid #fff;border-radius:50%;
  background:#ff8fbe;color:#fff;font-size:31px;font-weight:300;
  box-shadow:0 5px 15px #001b6c55
}
.month{display:flex;justify-content:center;align-items:center;gap:12px;margin:16px 0}
.month button{
  width:44px;height:44px;border:3px solid #fff;border-radius:50%;
  background:#fff;color:#1643a0;font-size:26px;box-shadow:0 4px 12px #001b6c35
}
.month span{
  min-width:205px;text-align:center;background:#fff;border-radius:24px;
  padding:11px 24px;font-weight:900;font-size:17px;
  box-shadow:0 4px 12px #001b6c25
}

.panel{
  background:rgba(248,250,255,.94);border:3px solid #fff;border-radius:24px;
  box-shadow:0 10px 28px #001b6c45;padding:18px;margin:12px 0
}
.summary{
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,#cfdcff 0%,#e6e0ff 55%,#f8dff0 100%);
  border-color:#b7ccff
}
.summary:after{
  content:"✦   ✧   ✦";position:absolute;right:22px;top:18px;
  color:#ff86b8;font-size:23px;letter-spacing:6px
}
.summary b{font-size:16px}
.total{font-size:47px;font-weight:900;line-height:1;margin:7px 0 13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  background:#fff;border:2px solid #c8d6f6;border-radius:18px;
  padding:8px 12px;font-size:12px;font-weight:900;box-shadow:0 3px 7px #3154a322
}

.card{
  position:relative;overflow:hidden;
  background:linear-gradient(105deg,rgba(255,255,255,.98),rgba(242,238,255,.95));
  border:3px solid #fff;border-radius:22px;padding:18px 20px;margin:13px 0;
  box-shadow:0 7px 20px #102d9140
}
.card:after{
  content:"✦";position:absolute;right:130px;top:23px;color:#ff9fc5;font-size:22px;opacity:.75
}
.head{display:flex;justify-content:space-between;align-items:center}
.name{font-size:24px;font-weight:900}
.target{font-size:13px;color:#5876b8;font-weight:900;margin-top:4px}
.check{
  width:55px;height:55px;border-radius:50%;border:4px solid #a9c0ee;
  background:#fff;color:#6991dc;font-size:24px;font-weight:900;
  box-shadow:inset 0 0 0 2px #eef3ff
}
.check.done{background:#ff86b7;border-color:#ff86b7;color:#fff;box-shadow:0 4px 10px #ff86b755}
.result{
  margin-top:12px;padding:11px 13px;background:#eef3ff;border-radius:12px;
  font-weight:900;font-size:14px
}
.result b{font-size:18px}
.progress{margin-top:11px}
.prow{display:flex;justify-content:space-between;font-size:12px;font-weight:900}
.bar{height:11px;background:#d9e1f5;border-radius:20px;overflow:hidden;margin-top:6px}
.fill{height:100%;background:linear-gradient(90deg,#ff83b6,#79a2f2);border-radius:20px;transition:.4s}
.actions{display:flex;gap:16px;margin-top:10px}
.link{border:0;background:none;color:#5274b5;font-size:12px;font-weight:900;padding:2px}
.edit{display:none;margin-top:9px}
.edit.show{display:block}
.edit input,.edit textarea,.addform input{
  width:100%;border:2px solid #cfdbf2;border-radius:11px;padding:10px;margin:4px 0;
  color:#17449d;background:#fff
}
.edit textarea{min-height:55px}
.save,.addgo{
  border:0;background:#4d7fd6;color:#fff;border-radius:11px;
  padding:9px 15px;font-weight:900
}
.addform{display:none}.addform.show{display:block}
.addform h3{margin:0 0 8px}.addrow{display:grid;grid-template-columns:70px 1fr;gap:8px}
.addgo{width:100%;margin-top:5px}
.history-title{
  color:#fff;text-shadow:2px 2px #173a98;font-size:20px;font-weight:900;margin:22px 0 8px
}
.empty{text-align:center;color:#7890bd;padding:16px}
@media(max-width:600px){
  .app{width:calc(100% - 10px);padding-top:18px}
  .logo{font-size:29px}.sub{font-size:10px}.moon{width:80px;height:80px}
  .moon:after{width:72px;height:72px}.name{font-size:21px}.total{font-size:40px}
}

.pixel-kitty{
  position:absolute;left:7%;top:27%;width:150px;height:150px;
  filter:drop-shadow(4px 5px 0 rgba(5,18,95,.55));
  animation:kittyFloat 4s ease-in-out infinite;
}
.kitty-head{
  position:absolute;left:28px;top:30px;width:94px;height:78px;
  background:#fff;border:5px solid #14277e;border-radius:45% 45% 42% 42%;
  image-rendering:pixelated;
}
.ear{
  position:absolute;top:16px;width:43px;height:45px;background:#fff;
  border:5px solid #14277e;z-index:-1;
}
.ear.left{left:25px;transform:rotate(-22deg);border-radius:12px 4px 12px 4px}
.ear.right{right:25px;transform:rotate(22deg);border-radius:4px 12px 4px 12px}
.eye{position:absolute;width:7px;height:11px;background:#111b56;border-radius:50%;top:31px}
.e1{left:27px}.e2{right:27px}
.nose{position:absolute;left:44px;top:45px;width:7px;height:5px;background:#f2b53e;border-radius:50%}
.whisker{
  position:absolute;width:23px;height:2px;background:#14277e;top:46px;
}
.w1{left:-21px;transform:rotate(-8deg)}.w2{right:-21px;transform:rotate(8deg)}
.bow{
  position:absolute;right:-4px;top:2px;width:24px;height:18px;background:#ff5f9f;
  border:3px solid #14277e;border-radius:45% 55% 45% 55%;
  transform:rotate(-12deg)
}
.bow:after{
  content:"";position:absolute;left:8px;top:4px;width:6px;height:6px;
  background:#ffd3e5;border-radius:50%
}
.kitty-body{
  position:absolute;left:47px;top:103px;width:57px;height:36px;background:#fff;
  border:5px solid #14277e;border-radius:35px 35px 18px 18px;
}
@keyframes kittyFloat{
  0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}
}
@media(max-width:600px){
  .pixel-kitty{left:3%;top:23%;transform:scale(.72);transform-origin:left top}
}

</style>
</head>
<body>


<main class="app">
  <div class="top">
    <div><div class="logo">My Savings ♡</div><div class="sub">little by little, your dreams grow ✦</div></div>
    <button class="iconbtn" id="openAdd">＋</button>
  </div>

  <div class="month"><button id="prev">‹</button><span id="month"></span><button id="next">›</button></div>

  <div class="panel addform" id="addform">
    <h3>✦ 新しい貯金を追加</h3>
    <div class="addrow"><input id="icon" value="♡" maxlength="3"><input id="name" placeholder="例：旅行"></div>
    <input id="monthly" type="number" min="1" placeholder="毎月の目標額">
    <input id="goal" type="number" min="0" placeholder="最終目標額（任意）">
    <button class="addgo" id="add">追加する ♡</button>
  </div>

  <section class="panel summary">
    <div><b>🍓 今までに貯めたお金</b></div>
    <div class="total" id="total">¥0</div>
    <div class="chips" id="chips"></div>
  </section>

  <div id="cards"></div>
  <div class="history-title">☆ 今月の記録</div>
  <section class="panel" id="history"></section>
</main>

<script>
const KEY="mySavingsApp_v1";
const OLD_KEYS=["mySavingsFinal_v3","mySavingsFinal_v2","mySavingsFinal"];
const defaults=[
{id:"saving",icon:"💰",name:"貯金",monthly:50000,goal:null},
{id:"nisa",icon:"📈",name:"NISA",monthly:20000,goal:null},
{id:"korea",icon:"🇰🇷",name:"韓国",monthly:50000,goal:300000}
];
let data=load();
function cloneDefaults(){return defaults.map(x=>({...x}))}
function normalize(d){
  if(!d || !Array.isArray(d.items)) return null;
  d.history=d.history && typeof d.history === "object" ? d.history : {};
  d.items=d.items.map(x=>({...x}));
  const korea=d.items.find(x=>x.id==="korea");
  if(korea && (!korea.goal || Number(korea.goal)<=0)) korea.goal=300000;
  return d;
}
function load(){
  try{
    const keys=[KEY,...OLD_KEYS];
    for(const k of keys){
      const raw=localStorage.getItem(k);
      if(!raw) continue;
      const d=normalize(JSON.parse(raw));
      if(d && d.items.length){
        if(k!==KEY) localStorage.setItem(KEY,JSON.stringify(d));
        return d;
      }
    }
  }catch(e){}
  const d=new Date();
  return{year:d.getFullYear(),month:d.getMonth()+1,items:cloneDefaults(),history:{}};
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(data));return true}
  catch(e){alert("保存できなかったよ。Safariのプライベートブラウズではなく通常モードで開いてみてね。");return false}
}
const monthEl=document.getElementById("month");
const chipsEl=document.getElementById("chips");
const cardsEl=document.getElementById("cards");
const historyEl=document.getElementById("history");
const totalEl=document.getElementById("total");
function key(){return data.year+"-"+String(data.month).padStart(2,"0")}
function yen(n){return"¥"+Number(n||0).toLocaleString()}
function rec(id){let k=key();data.history[k]??={};data.history[k][id]??={amount:0,done:false,note:""};return data.history[k][id]}
function total(id){return Object.values(data.history).reduce((s,m)=>s+Number(m[id]?.amount||0),0)}
function all(){return data.items.reduce((s,i)=>s+total(i.id),0)}
function esc(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function toggle(id){let i=data.items.find(x=>x.id===id),r=rec(id);if(r.done){r.amount=0;r.done=false}else{r.amount=i.monthly;r.done=true}save();render()}
function edit(id){document.querySelector('[data-edit="'+id+'"]').classList.toggle("show")}
function saveEdit(id){
  let b=document.querySelector('[data-edit="'+id+'"]'),r=rec(id),i=data.items.find(x=>x.id===id);
  const target=Math.max(0,Number(b.querySelector(".targetAmt").value)||0);
  const amount=Math.max(0,Number(b.querySelector(".amt").value)||0);
  const goal=Math.max(0,Number(b.querySelector(".goalAmt").value)||0);
  if(target<=0){alert("今月の目標金額は1円以上にしてね♡");return}
  i.monthly=target;
  i.goal=goal>0?goal:null;
  r.amount=amount;
  r.done=amount>=target;
  r.note=b.querySelector(".note").value.trim();
  save();render();
}
function del(id){let i=data.items.find(x=>x.id===id);if(confirm("「"+i.name+"」を削除する？")){data.items=data.items.filter(x=>x.id!==id);save();render()}}
const openAddBtn=document.getElementById("openAdd");
const addFormEl=document.getElementById("addform");
const addBtn=document.getElementById("add");
const iconEl=document.getElementById("icon");
const nameEl=document.getElementById("name");
const monthlyEl=document.getElementById("monthly");
const goalEl=document.getElementById("goal");

openAddBtn.addEventListener("click",()=>addFormEl.classList.toggle("show"));
addBtn.addEventListener("click",()=>{
  const n=nameEl.value.trim(),m=Number(monthlyEl.value),g=Number(goalEl.value);
  if(!n||m<=0){alert("名前と毎月の目標額を入れてね♡");return}
  data.items.push({
    id:"i"+Date.now(),
    icon:iconEl.value.trim()||"♡",
    name:n,
    monthly:m,
    goal:g>0?g:null
  });
  save(); render();
  nameEl.value=""; monthlyEl.value=""; goalEl.value=""; iconEl.value="♡";
  addFormEl.classList.remove("show");
});
document.getElementById("prev").addEventListener("click",()=>{
  data.month--; if(data.month<1){data.month=12;data.year--} save(); render();
});
document.getElementById("next").addEventListener("click",()=>{
  data.month++; if(data.month>12){data.month=1;data.year++} save(); render();
});
function render(){
  monthEl.textContent=data.year+"年"+data.month+"月";totalEl.textContent=yen(all());
  chipsEl.innerHTML="";data.items.forEach(i=>{let c=document.createElement("div");c.className="chip";c.textContent=i.icon+" "+i.name+" "+yen(total(i.id));chipsEl.appendChild(c)});
  cardsEl.innerHTML="";
  data.items.forEach(i=>{let r=rec(i.id),t=total(i.id);
    const monthPct=i.monthly>0?Math.min(100,Number(r.amount||0)/i.monthly*100):0;
    const monthlyProg=`<div class="progress"><div class="prow"><span>今月の達成率</span><span>${monthPct.toFixed(1)}%</span></div><div class="bar"><div class="fill" style="width:${monthPct}%"></div></div><div class="prow"><span>${yen(r.amount)} / ${yen(i.monthly)}</span></div></div>`;
    const goalPct=i.goal?Math.min(100,t/i.goal*100):0;
    const goalProg=i.goal?`<div class="progress"><div class="prow"><span>累計達成率</span><span>${goalPct.toFixed(1)}%</span></div><div class="bar"><div class="fill" style="width:${goalPct}%"></div></div><div class="prow"><span>${yen(t)} / ${yen(i.goal)}</span></div></div>`:"";
    let prog=monthlyProg+goalProg;
    let c=document.createElement("article");c.className="card";c.innerHTML=`<div class="head"><div><div class="name">${esc(i.icon)} ${esc(i.name)}</div><div class="target">今月の目標 ${yen(i.monthly)}</div></div><div style="display:flex;align-items:center;gap:10px"><div style="font-size:27px">🎀</div><button class="check ${r.done?"done":""}" data-check="${i.id}">${r.done?"✓":"○"}</button></div></div><div class="result">今月の実績： <b>${yen(r.amount)}</b></div>${prog}<div class="actions"><button class="link" data-open="${i.id}">✎ 金額・備考を変更</button><button class="link" data-del="${i.id}">削除</button></div><div class="edit" data-edit="${i.id}">
  <label style="display:block;font-size:12px;font-weight:900;margin-top:4px">今月の目標金額</label>
  <input class="targetAmt" type="number" min="0" value="${i.monthly}" placeholder="毎月の目標金額">
  <label style="display:block;font-size:12px;font-weight:900;margin-top:4px">実際に貯めた金額</label>
  <input class="amt" type="number" min="0" value="${r.amount||""}" placeholder="実際に貯めた金額">
  <label style="display:block;font-size:12px;font-weight:900;margin-top:4px">最終目標額（任意）</label>
  <input class="goalAmt" type="number" min="0" value="${i.goal||""}" placeholder="例：300000">
  <textarea class="note" placeholder="備考（例：30000しか入れられなかった）">${esc(r.note||"")}</textarea>
  <button class="save" data-save="${i.id}">保存する ♡</button>
</div>`;cardsEl.appendChild(c)
  });
  cardsEl.querySelectorAll("[data-check]").forEach(b=>b.onclick=()=>toggle(b.dataset.check));
  cardsEl.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>edit(b.dataset.open));
  cardsEl.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>del(b.dataset.del));
  cardsEl.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>saveEdit(b.dataset.save));
  historyEl.innerHTML="";let n=0,k=key();data.items.forEach(i=>{let r=data.history[k]?.[i.id];if(!r||!Number(r.amount))return;n++;let x=document.createElement("div");x.className="hrow";x.textContent=i.name+"　"+yen(r.amount)+(r.note?"　"+r.note:"");historyEl.appendChild(x)});if(!n)historyEl.innerHTML='<div class="empty">まだ今月の記録はないよ ♡</div>';
  save()
}
render();
</script>
</body>
</html>
